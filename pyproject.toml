[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollin-fruit-fly-lab"
version = "0.0.1"
description = "Reproducible computational laboratory for fruit-fly connectome experiments"
requires-python = ">=3.11"
authors = [{name = "ŌLLIN"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
